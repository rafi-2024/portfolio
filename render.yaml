services:
  - type: web
    name: personalwebsite
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://portfolio-o0m8.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: personalwebsite-db
          property: connectionString
      - key: N8N_WEBHOOK_URL
        sync: false

databases:
  - name: personalwebsite-db
    plan: free
    databaseName: portfolio_db
    user: portfolio_user
    postgresMajorVersion: "16"
