services:
  - type: web
    name: personalwebsite
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://portfolio-o0m8.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: personalwebsite-db
          property: connectionString
      # Points at the internal n8n private service below (not publicly reachable)
      - key: N8N_WEBHOOK_URL
        value: http://n8n:5678/webhook/contact-form
  # n8n workflow automation (email notifications on contact form submit).
  # Private service: only reachable inside Render's network by the web app.
  - type: pserv
    name: n8n
    runtime: docker
    plan: starter
    branch: main
    image:
      url: docker.io/n8nio/n8n:1-bookworm # pin major version for reproducible deploys
    envVars:
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: http
      - key: N8N_HOST
        value: n8n
      - key: WEBHOOK_URL
        sync: false   # set in dashboard to your public app URL if n8n must call out
      - key: GENERIC_TIMEZONE
        value: UTC
      # Required: encrypts stored credentials. The pserv filesystem is ephemeral,
      # so without a FIXED key every redeploy wipes all n8n credentials.
      - key: N8N_ENCRYPTION_KEY
        sync: false   # set in Render dashboard (secret, never change once set)
      - key: N8N_USER_MANAGEMENT_DISABLED
        value: "false"
      # Owner account is created on first visit to the n8n UI (via Render shell/port-forward).
      # N8N_BASIC_AUTH_* vars were removed in n8n v1.x and are intentionally not set.

databases:
  - name: personalwebsite-db
    plan: free
    databaseName: portfolio_db
    user: portfolio_user
    postgresMajorVersion: "16"
